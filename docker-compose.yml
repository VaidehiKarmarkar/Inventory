services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-migrate
    environment:
      NODE_ENV: production
      # Supabase direct host is IPv6-only; use Session pooler (IPv4) instead
      DATABASE_URL: postgresql://postgres.qqfvfizhzfkthhlqrahv:JukxPJpwCyyUruXm@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
    command:
      [
        "pnpm",
        "--filter",
        "@workspace/db",
        "run",
        "push",
      ]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres.qqfvfizhzfkthhlqrahv:JukxPJpwCyyUruXm@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      SESSION_SECRET: change-me-to-a-long-random-string
      COOKIE_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully

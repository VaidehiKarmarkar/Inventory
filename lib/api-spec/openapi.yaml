openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Billing & Inventory Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard stats
  - name: products
    description: Product management
  - name: inventory
    description: Inventory management
  - name: orders
    description: Order management
  - name: users
    description: User management (admin only)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Admin dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /dashboard/user:
    get:
      operationId: getUserDashboard
      tags: [dashboard]
      summary: Get user dashboard statistics
      responses:
        "200":
          description: User dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"

  /dashboard/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [dashboard]
      summary: Get recent orders for dashboard feed
      responses:
        "200":
          description: Recent orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /dashboard/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [dashboard]
      summary: Get products with low stock (< 10 units)
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  # ── Products ──────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Inventory ─────────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory transactions
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Inventory transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponse"
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Add or reduce inventory for a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustInput"
      responses:
        "201":
          description: Inventory adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransaction"

  # ── Orders ────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin sees all, user sees own)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order and generate invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error (e.g. insufficient stock)

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/payments:
    post:
      operationId: recordPayment
      tags: [orders]
      summary: Record a payment transaction with mandatory remarks for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentInput"
      responses:
        "200":
          description: Updated order detail with payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Validation error
        "404":
          description: Order not found

  /orders/{id}/invoice:
    get:
      operationId: downloadInvoice
      tags: [orders]
      summary: Download invoice PDF for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF invoice
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /orders/{id}/send-email:
    post:
      operationId: sendInvoiceEmail
      tags: [orders]
      summary: Mock send invoice email to customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email sent (mock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Users (Admin) ─────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/{id}/toggle-active:
    patch:
      operationId: toggleUserActive
      tags: [users]
      summary: Activate or deactivate a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"

  /users/{id}/reset-password:
    patch:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset user password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Auth ──────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required: [id, name, username, role]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, user]
        isActive:
          type: boolean

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Dashboard ─────────────────────────────────────────────────────────
    AdminDashboard:
      type: object
      required: [totalProducts, totalInventory, totalOrders, todaySales, monthlySales, totalUsers, outOfStockCount, lowStockCount]
      properties:
        totalProducts:
          type: integer
        totalInventory:
          type: integer
        totalOrders:
          type: integer
        todaySales:
          type: number
        monthlySales:
          type: number
        totalUsers:
          type: integer
        outOfStockCount:
          type: integer
        lowStockCount:
          type: integer

    UserDashboard:
      type: object
      required: [ordersToday, totalOrders, totalRevenue]
      properties:
        ordersToday:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number

    # ── Products ──────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, name, description, price, availableQuantity, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        availableQuantity:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ProductInput:
      type: object
      required: [name, price, availableQuantity]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
        availableQuantity:
          type: integer

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        availableQuantity:
          type: integer

    ProductListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Inventory ─────────────────────────────────────────────────────────
    InventoryTransaction:
      type: object
      required: [id, productId, productName, previousQuantity, currentQuantity, actionType, updatedAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        previousQuantity:
          type: integer
        quantityAdded:
          type: ["integer", "null"]
        quantityReduced:
          type: ["integer", "null"]
        currentQuantity:
          type: integer
        actionType:
          type: string
          enum: [add, reduce, order]
        updatedById:
          type: ["integer", "null"]
        updatedByName:
          type: ["string", "null"]
        updatedAt:
          type: string

    InventoryAdjustInput:
      type: object
      required: [productId, quantity, actionType]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
        actionType:
          type: string
          enum: [add, reduce]

    InventoryListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InventoryTransaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Orders ────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, productId, productName, quantity, unitPrice, total]
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        total:
          type: number

    OrderItemInput:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
        unitPrice:
          type: number

    Order:
      type: object
      required: [id, invoiceNumber, customerName, customerMobile, subtotal, gstPercentage, gstAmount, grandTotal, paidAmount, pendingAmount, status, createdAt]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        customerName:
          type: string
        customerMobile:
          type: string
        customerEmail:
          type: ["string", "null"]
        customerAddress:
          type: ["string", "null"]
        subtotal:
          type: number
        gstPercentage:
          type: number
        gstAmount:
          type: number
        referralCharges:
          type: number
        discount:
          type: number
        grandTotal:
          type: number
        paidAmount:
          type: number
        pendingAmount:
          type: number
        paymentMethod:
          type: string
          enum: [Cash, UPI]
          default: Cash
        status:
          type: string
        createdById:
          type: ["integer", "null"]
        createdByName:
          type: ["string", "null"]
        createdAt:
          type: string

    OrderDetail:
      type: object
      required: [id, invoiceNumber, customerName, customerMobile, subtotal, gstPercentage, gstAmount, grandTotal, paidAmount, pendingAmount, status, createdAt, items]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        customerName:
          type: string
        customerMobile:
          type: string
        customerEmail:
          type: ["string", "null"]
        customerAddress:
          type: ["string", "null"]
        subtotal:
          type: number
        gstPercentage:
          type: number
        gstAmount:
          type: number
        referralCharges:
          type: number
        discount:
          type: number
        grandTotal:
          type: number
        paidAmount:
          type: number
        pendingAmount:
          type: number
        paymentMethod:
          type: string
          enum: [Cash, UPI]
          default: Cash
        status:
          type: string
        createdById:
          type: ["integer", "null"]
        createdByName:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/OrderPayment"

    OrderPayment:
      type: object
      required: [id, orderId, amount, paymentMethod, remarks, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        amount:
          type: number
        paymentMethod:
          type: string
        remarks:
          type: string
        createdById:
          type: ["integer", "null"]
        createdByName:
          type: ["string", "null"]
        createdAt:
          type: string

    RecordPaymentInput:
      type: object
      required: [amount, paymentMethod, remarks]
      properties:
        amount:
          type: number
          minimum: 0.01
        paymentMethod:
          type: string
          enum: [Cash, UPI]
        remarks:
          type: string
          minLength: 1

    OrderInput:
      type: object
      required: [customerName, customerMobile, items, gstPercentage]
      properties:
        customerName:
          type: string
          minLength: 1
        customerMobile:
          type: string
        customerEmail:
          type: string
        customerAddress:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
          minItems: 1
        gstPercentage:
          type: number
        referralCharges:
          type: number
        discount:
          type: number
        paidAmount:
          type: number
        paymentMethod:
          type: string
          enum: [Cash, UPI]
          default: Cash

    OrderListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Users ─────────────────────────────────────────────────────────────
    AppUser:
      type: object
      required: [id, name, username, role, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, username, password, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        isActive:
          type: boolean
        password:
          type: string
          minLength: 6

    ResetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 6

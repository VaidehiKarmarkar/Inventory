# Supply-chain attack defense: require packages to be published for at least
# 1 day before allowing installation. Do not disable this setting.
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.21
  "@types/node": ^25.3.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

# pnpm 10 (removed in v11 — kept for older Hostinger images)
onlyBuiltDependencies:
  - "@swc/core"
  - msw
  - unrs-resolver
ignoredBuiltDependencies:
  - esbuild

# pnpm 11: required. `false` = reviewed skip (does NOT trigger ERR_PNPM_IGNORED_BUILDS).
# Optional @esbuild/* bins + root postinstall chmod are enough for vite/esbuild.
allowBuilds:
  esbuild: false
  "@swc/core": true
  msw: true
  unrs-resolver: true

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
